<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{site_name}}</title>
</head>

<body style="margin:0; padding:0; background:#f4f6f8; font-family:Arial,Helvetica,sans-serif;">

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f6f8;">
        <tr>
            <td align="center" style="padding:32px 16px;">

                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px; background:#ffffff; border:1px solid #e4e6eb; border-radius:14px; overflow:hidden;">

                    <tr>
                        <td align="center" style="padding:26px 32px 20px; border-bottom:1px solid #e4e6eb;">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td style="width:38px; height:38px; background:#0f766e; border-radius:10px; color:#ffffff; font-size:17px; font-weight:bold; text-align:center; line-height:38px;">{{site_initial}}</td>
                                    <td style="padding-left:10px; font-size:16px; font-weight:bold; color:#16181d;">{{site_name}}</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:32px;">
                            {{email_body}}
                        </td>
                    </tr>

                    <tr>
                        <td align="center" style="padding:20px 32px; background:#fafbfc; border-top:1px solid #e4e6eb;">
                            <p style="margin:0 0 6px; font-size:13px; color:#6b7280;">
                                Sent by <a href="{{site_url}}" style="color:#0f766e; text-decoration:none;">{{site_name}}</a>
                            </p>
                            <p style="margin:0; font-size:12px; color:#9aa1ad;">
                                If you weren't expecting this email you can safely ignore it.
                            </p>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>

</html>
