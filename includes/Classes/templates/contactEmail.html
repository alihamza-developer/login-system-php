<h1 style="margin:0 0 12px; font-size:21px; font-weight:bold; color:#16181d;">New contact message</h1>

<p style="margin:0 0 20px; font-size:15px; line-height:1.6; color:#4b5563;">
    Someone submitted the contact form on {{site_name}}.
</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px; border:1px solid #e4e6eb; border-radius:10px;">
    <tr>
        <td style="padding:12px 16px; border-bottom:1px solid #e4e6eb; font-size:13px; color:#6b7280; width:90px;">Name</td>
        <td style="padding:12px 16px; border-bottom:1px solid #e4e6eb; font-size:14px; color:#16181d;">{{name}}</td>
    </tr>
    <tr>
        <td style="padding:12px 16px; border-bottom:1px solid #e4e6eb; font-size:13px; color:#6b7280;">Email</td>
        <td style="padding:12px 16px; border-bottom:1px solid #e4e6eb; font-size:14px;">
            <a href="mailto:{{email}}" style="color:#0f766e; text-decoration:none;">{{email}}</a>
        </td>
    </tr>
    <tr>
        <td style="padding:12px 16px; font-size:13px; color:#6b7280;">Subject</td>
        <td style="padding:12px 16px; font-size:14px; color:#16181d;">{{subject}}</td>
    </tr>
</table>

<p style="margin:0 0 8px; font-size:13px; font-weight:bold; color:#6b7280;">Message</p>

<div style="padding:16px; background:#fafbfc; border:1px solid #e4e6eb; border-radius:10px; font-size:14px; line-height:1.6; color:#16181d;">
    {{message}}
</div>
